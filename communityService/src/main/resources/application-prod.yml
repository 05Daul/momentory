spring:
  application:
    name:
      'communityService'
  datasource:
    url: jdbc:postgresql:///miniblog
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    database: postgresql
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    gcp:
      sql:
        enabled: true
        database-name: miniblog
        instance-connection-name: ${bucket-name}

server:
  port: 1006

