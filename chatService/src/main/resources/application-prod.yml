spring:
  application:
    name: chatService

  datasource:
    url: jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    database: postgresql
    hibernate:
      ddl-auto: validate

  data:
    mongodb:
      uri: "mongodb+srv://devopselre:${MONGO_PASSWORD}@monetory.6rumxqz.mongodb.net/?appName=monetory"
      database: chat_db

  kafka:
    bootstrap-servers: kafka-service:9092

    consumer:
      group-id: chat-service-group
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: daul.chatservice.dto.ChatMessageDto
        spring.json.use.type.headers: false
        spring.json.add.type.headers: false
        spring.json.fail.on.empty: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add-type-headers: false
        spring.json.use.type.headers: false
server:
  port: 1005
