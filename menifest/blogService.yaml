apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-service
  template:
    metadata:
      labels:
        app: blog-service

    spec:
      # 앱이 worker 노드에만 뜨도록 설정
      nodeSelector:
        workload: app
      containers:
        - name: blog-app
          image: daul0519/daul0519/blog-service:v1.1
          ports:
            - containerPort: 1004
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod

            - name: DB_USERNAME
              valueFrom:
                 secretKeyRef:
                    name: db-secret
                    key: username

            - name: DB_PASSWORD
              valueFrom:
                 secretKeyRef:
                    name: db-secret
                    key: password

            - name: bucket-url
              valueFrom:
                secretKeyRef:
                  name: bucket-url
                  key: baseurl


        - name: cloud-sql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:latest
          command:
            - "/cloud_sql_proxy"
            - "-instances=$(INSTANCE_CONNECTION_NAME)=tcp:5432"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                secretKeyRef:
                  name: bucket-secret
                  key: instanceName