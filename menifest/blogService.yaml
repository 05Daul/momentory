apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-service
  template:
    metadata:
      labels:
        app: blog-service

    spec:
      # 앱이 worker 노드에만 뜨도록 설정
      nodeSelector:
        workload: app
      containers:
        - name: blog-app
          image: daul0519/blog-service:v2
          ports:
            - containerPort: 1004
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod

            - name: DB_USERNAME
              valueFrom:
                 secretKeyRef:
                    name: db-secret
                    key: username

            - name: DB_PASSWORD
              valueFrom:
                 secretKeyRef:
                    name: db-secret
                    key: password

            - name: bucket-url
              valueFrom:
                secretKeyRef:
                  name: bucket-url
                  key: bucketurl
