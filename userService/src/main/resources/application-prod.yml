spring:
  application:
    name:
      'userService'
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  datasource:
    url: jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    database: postgresql
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    gcp:
      storage:
        bucket: miniblog-storage

server:
  port: 1003

# JWT 설정
jwt:
  secret: ${jwt_secret}
  expired: 43200000
  refresh: 43200000

logging:
  level:
    org.springframework.security: DEBUG

file:
  bucket-name: miniblog-storage
  base-url: ${bucket-url}
