spring:
  application:
    name: 'gateway'

  cloud:
    gateway:
      # 모든 라우트에 공통으로 적용되는 필터: 중복 CORS 헤더 제거
      default-filters:
        - DeduplicateResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "https://momentory-*.vercel.app"
                  - "https://*.ngrok-free.dev"
                  - "http://localhost:3000" # 로컬 테스트용 (필요시 사용)
                allow-credentials: true
                allowedHeaders:
                  - "*"
                  - "ngrok-skip-browser-warning" # ngrok 경고 방지용 헤더 허용
                allowedMethods:
                  - PUT
                  - GET
                  - POST
                  - DELETE
                  - PATCH
                  - OPTIONS
                exposed-headers:
                  - Authorization
                  - "*"

      routes:
        - id: chatService
          uri: http://chat-service:1005
          predicates:
            - Path=/chat/**

        - id: blogService
          uri: http://blog-service:1004
          predicates:
            - Path=/blog/images/**
          filters:
            - StripPrefix=1

        - id: blogService
          uri: http://blog-service:1004
          predicates:
            - Path=/blog/**

        - id: userService
          uri: http://user-service:1003
          predicates:
            - Path=/user/**

        - id: userService
          uri: http://user-service:1003
          predicates:
            - Path=/friends/**

        - id: userService
          uri: http://user-service:1003
          predicates:
            - Path=/uploads/**

        - id: communityService
          uri: http://community-service:1006
          predicates:
            - Path=/community/**

server:
  port: 1000

jwt:
  secret: ${jwt_secret}
  expired: 4320000
  refresh: 432000000

logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always